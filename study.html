<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getDatabase, ref, set, push, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  // ── 설정 (desk.html과 동일) ──
  const OWNER_EMAIL = "leetae712@gmail.com";
  const firebaseConfig = {
    apiKey: "AIzaSyDBgqclt0Qnnal7SlQmoYL-63L0DDplZkM",
    authDomain: "soc-c-qna.web.app",
    databaseURL: "https://soc-c-qna-default-rtdb.firebaseio.com",
    projectId: "soc-c-qna",
    storageBucket: "soc-c-qna.firebasestorage.app",
    messagingSenderId: "927605189358",
    appId: "1:927605189358:web:9ea5171373ac4c9e8661ff"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const $ = id => document.getElementById(id);
  const escapeHTML = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const WEEKDAYS = ['일','월','화','수','목','금','토'];
  const MORNING_H = 8;   // desk와 동일: 이 시각 전 시작 = 아침 공부

  const KANA = (() => {
  const C = { '': 11, k: 15, g: 0, s: 9, z: 12, t: 16, d: 3, n: 2, h: 18, b: 7, p: 17, m: 6, r: 5 };   // 초성 인덱스
  const V = [0, 20, 13, 5, 8];   // ㅏ ㅣ ㅜ ㅔ ㅗ
  const t = {};
  [['', 'あいうえお'], ['k', 'かきくけこ'], ['g', 'がぎぐげご'], ['s', 'さしすせそ'], ['z', 'ざじずぜぞ'], ['t', 'たちつてと'], ['d', 'だぢづでど'],
   ['n', 'なにぬねの'], ['h', 'はひふへほ'], ['b', 'ばびぶべぼ'], ['p', 'ぱぴぷぺぽ'], ['m', 'まみむめも'], ['r', 'らりるれろ']]
    .forEach(([c, ks]) => [...ks].forEach((k, i) => { t[k] = [C[c], V[i]]; }));
  Object.assign(t, { 'す': [9, 18], 'ず': [12, 18], 'つ': [14, 18], 'づ': [12, 18], 'ち': [14, 20], 'ぢ': [12, 20],
    'や': [11, 2], 'ゆ': [11, 17], 'よ': [11, 12], 'わ': [11, 9], 'を': [11, 8] });
  const Y = { 'ゃ': 2, 'ゅ': 17, 'ょ': 12 };                       // 요음 모음 ㅑ ㅠ ㅛ
  const yBase = 'きぎしじちにひびぴみり';                              // 요음이 붙을 수 있는 い단
  return { t, Y, yBase };
})();
function kanaToHangul(text) {
  const S = (c, v, j = 0) => String.fromCharCode(0xAC00 + (c * 21 + v) * 28 + j);
  const isU = v => v === 13 || v === 18 || v === 17;
  return text.split(/(\s+)/).map(word => {
    if (!word || /^\s+$/.test(word)) return word;
    const ks = [...word].map(ch => { const cp = ch.charCodeAt(0); return cp >= 0x30A1 && cp <= 0x30F6 ? String.fromCharCode(cp - 0x60) : ch; });
    const syl = [];
    for (let i = 0; i < ks.length; i++) {
      const ch = ks[i], last = i === ks.length - 1 && ks.length > 1, prev = syl[syl.length - 1];
      if (ch === 'は' && last) { syl.push({ c: 11, v: 9 }); continue; }
      if (ch === 'へ' && last) { syl.push({ c: 11, v: 5 }); continue; }
      if (ch === 'ん') { if (prev && prev.c !== undefined) prev.j = 4; else syl.push({ c: 11, v: 18, j: 4 }); continue; }
      if (ch === 'っ') { if (prev && prev.c !== undefined) prev.j = 19; continue; }
      if (ch === 'ー') { syl.push({ long: true }); continue; }
      if (KANA.Y[ch] !== undefined && prev && prev.c !== undefined && KANA.yBase.includes(ks[i - 1])) {
        prev.v = KANA.Y[ch];
        if (prev.c === 12 || prev.c === 14) prev.v = { 2: 0, 17: 13, 12: 8 }[prev.v];   // じゃ→자 ちゃ→차
        continue;
      }
      const m = KANA.t[ch];
      if (!m) { syl.push({ raw: ch }); continue; }
      let [c, v] = m;
      if ((i === 0 || (prev && prev.raw !== undefined)) && (c === 15 || c === 16)) c = c === 15 ? 0 : 3;   // 어두(기호 뒤 포함) か행→ㄱ, た행→ㄷ
      if (prev && prev.c !== undefined && prev.j === undefined && c === 11) {   // 장음
        const pv = prev.v;
        if ((ch === 'う' && (pv === 8 || pv === 12 || isU(pv))) || (ch === 'い' && (pv === 5 || pv === 20)) ||
            (ch === 'あ' && (pv === 0 || pv === 2)) || (ch === 'え' && pv === 5) || (ch === 'お' && pv === 8)) { syl.push({ long: true }); continue; }
      }
      syl.push({ c, v });
    }
    return syl.map(s => s.raw !== undefined ? s.raw : s.long ? '-' : S(s.c, s.v, s.j || 0)).join('');
  }).join('').replace(/。/g, '.').replace(/、/g, ',');
}


  // ── 카드 선택 (desk makeDaily와 동일) ──
  function pick(D, today) {
    const n = D.days.length, i = Math.max(0, Math.floor((dayStart(today) - new Date(D.start + 'T00:00:00')) / 86400000));
    return { card: D.days[i % n], day: i % n + 1, round: Math.floor(i / n) + 1, title: D.title };
  }
  const cap = x => `Day ${x.day} · ${x.card.t}` + (x.round > 1 ? ` · ${x.round}회차` : '');
  // 일본어 비교 — Mac 창(daily_study.py)과 같은 규칙: NFKC 후 공백·구두점 제거, 완전 일치
  const normJa = s => (s || '').normalize('NFKC').replace(/[\s。、．，！？.,!?「」『』・…\-–—~〜]/g, '');
  const jaMatch = (typed, answer) => normJa(answer) !== '' && normJa(typed) === normJa(answer);

  // ── 게이트 ──
  const gate = $('gate'), appEl = $('app'), gateWarn = $('gateWarn');
  const showWarn = msg => { gateWarn.textContent = msg; gateWarn.style.display = ''; };
  const showGate = () => { gate.style.display = ''; appEl.style.display = 'none'; };
  const provider = new GoogleAuthProvider();
  $('signInBtn').addEventListener('click', async () => {
    gateWarn.style.display = 'none';
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request') {
        try { await signInWithRedirect(auth, provider); } catch (e2) { showWarn(e2.message); }
      } else if (e.code !== 'auth/popup-closed-by-user') showWarn(e.message);
    }
  });
  getRedirectResult(auth).catch(() => {});
  let booted = false;
  onAuthStateChanged(auth, user => {
    if (user && user.email === OWNER_EMAIL) { if (!booted) { booted = true; boot(); } }
    else if (user) { showGate(); showWarn(`${user.email} 계정은 접근 권한이 없습니다.`); signOut(auth); }
    else showGate();
  });
  // 로컬 미리보기 전용 — localhost에서만 게이트를 건너뛰어 화면을 확인 (기록 쓰기는 권한이 없어 실패함)
  if (location.hostname === 'localhost') window.__studyPreview = () => boot({ preview: true });

  // ── 본문 ──
  let G, J, openedAt, geoPass = false, jpPass = false;
  async function boot(opt = {}) {
    gate.style.display = 'none'; appEl.style.display = '';
    const now = new Date(), today = keyOf(now);
    openedAt = Date.now();
    $('meta').innerHTML = `<b>${today}</b> (${WEEKDAYS[now.getDay()]})`;
    let doneRec = null;
    if (!opt.preview) {
      try { doneRec = (await get(ref(db, 'desk/study/daily/' + today))).val(); }
      catch (e) { showGate(); showWarn('데이터 접근이 거부되었습니다. DB 보안 규칙을 확인하세요.'); return; }
    }
    if (doneRec) { renderDone(doneRec); return; }
    let geoD, jpD;
    try {
      [geoD, jpD] = await Promise.all(['data/geography-daily.json', 'data/japanese-daily.json'].map(f => fetch(f, { cache: 'no-cache' }).then(r => r.json())));
    } catch (e) { showGate(); showWarn('카드를 불러오지 못했습니다. 네트워크를 확인하세요.'); return; }
    G = pick(geoD, now); J = pick(jpD, now);
    renderGeo(); renderJp();
    $('geo').hidden = false; $('jp').hidden = false; $('footRow').hidden = false;
  }

  function renderGeo() {
    const c = G.card;
    $('geoTitle').textContent = '지리학'; $('geoCap').textContent = cap(G);
    $('geoCat').textContent = c.c; $('geoQ').textContent = c.q;
    $('geoA').textContent = c.a; $('geoX').textContent = c.x; $('geoR').textContent = c.r || '';
    $('geoK').innerHTML = (c.k || []).map(([k, d]) => `<div class="geo-term"><b>${escapeHTML(k)}</b><span class="q">${escapeHTML(d)}</span></div>`).join('');
  }
  function renderJp() {
    const c = J.card;
    $('jpTitle').textContent = J.title; $('jpCap').textContent = cap(J);
    $('jpS').textContent = c.s; $('jpP').textContent = kanaToHangul(c.s); $('jpM').textContent = c.m; $('jpG').textContent = c.g;
    $('jpE').innerHTML = `<span lang="ja">${escapeHTML(c.e[0])}</span><span class="r">${escapeHTML(kanaToHangul(c.e[0]))}</span><span class="k q">${escapeHTML(c.e[1])}</span>`;
    const words = [...(c.v || []).map(([w, , k]) => [w, k]), ...(c.w || [])];
    $('jpV').innerHTML = words.map(([w, k]) =>
      `<div class="jp-row"><b lang="ja">${escapeHTML(w)}</b><span class="r">${escapeHTML(kanaToHangul(w))}</span><span class="k q">${escapeHTML(k)}</span></div>`).join('');
  }
  function renderDone(rec) {
    $('done').hidden = false; $('footRow').hidden = true;
    $('doneCap').textContent = `지리 Day ${rec.geo?.day ?? '–'} · 일본어 Day ${rec.jp?.day ?? '–'}`;
    const t = rec.finishedAt ? new Date(rec.finishedAt) : null;
    $('doneP').textContent = t ? `${pad(t.getHours())}:${pad(t.getMinutes())}에 마쳤습니다. desk 공부 기록에 「복습」으로 남았습니다.` : 'desk 공부 기록에 「복습」으로 남았습니다.';
    $('doneAns').innerHTML = rec.geo ? `<span class="geo-cap">${escapeHTML(rec.geo.t || '')}</span>${escapeHTML(rec.geo.q || '')}<span class="geo-cap">내 답</span>${escapeHTML(rec.geo.myAnswer || '')}` : '';
  }

  // 01 지리
  $('geoIn').addEventListener('input', () => {
    const n = $('geoIn').value.trim().length;
    $('geoHint').textContent = `${n} / 20`; $('geoBtn').disabled = n < 20;
  });
  $('geoBtn').addEventListener('click', () => {
    geoPass = true;
    $('geo').classList.add('pass'); $('geoIn').readOnly = true; $('geoBtn').disabled = true;
    $('geoHint').textContent = '내 답과 비교해 보세요';
    $('jp').classList.remove('locked');
    $('jp').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // 02 일본어
  $('jpIn').addEventListener('input', () => { $('jpBtn').disabled = !$('jpIn').value.trim(); $('jpHint').textContent = ''; $('jpHint').className = 'hint'; });
  $('jpIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('jpBtn').disabled) $('jpBtn').click(); });
  $('jpBtn').addEventListener('click', () => {
    if (!jaMatch($('jpIn').value, J.card.s)) { $('jpHint').textContent = '문장이 다릅니다 — 다시'; $('jpHint').className = 'hint bad'; $('jpIn').select(); return; }
    jpPass = true;
    $('jp').classList.add('pass'); $('jpIn').readOnly = true; $('jpBtn').disabled = true;
    $('jpHint').textContent = '정확합니다'; $('jpHint').className = 'hint good';
    $('finish').disabled = !(geoPass && jpPass);
    $('footRow').scrollIntoView({ behavior: 'smooth', block: 'end' });
  });

  // 완료 → desk 공부 기록 (세션은 desk 타이머와 같은 형식이라 히트맵·연속일에 그대로 잡힘)
  $('finish').addEventListener('click', async () => {
    if (!(geoPass && jpPass)) return;
    $('finish').disabled = true; $('finish').textContent = '기록 중…';
    const end = Date.now(), st = new Date(openedAt), date = keyOf(st);
    const min = Math.min(60, Math.max(1, Math.round((end - openedAt) / 60000)));
    const rec = { finishedAt: new Date(end).toISOString(),
      geo: { day: G.day, t: G.card.t, q: G.card.q, myAnswer: $('geoIn').value.trim() },
      jp: { day: J.day, t: J.card.t, s: J.card.s } };
    try {
      await push(ref(db, 'desk/study/sessions'), { subject: '복습', note: `지리 Day ${G.day} · 일본어 Day ${J.day}`,
        start: openedAt, end, min, date, morning: st.getHours() < MORNING_H, daily: true });
      await set(ref(db, 'desk/study/daily/' + date), rec);
      const subs = (await get(ref(db, 'desk/study/subjects'))).val() || {};
      if (!Object.values(subs).some(s => s && s.name === '복습')) await push(ref(db, 'desk/study/subjects'), { name: '복습', createdAt: Date.now() });
    } catch (e) {
      $('finish').textContent = '오늘 복습 완료'; $('finish').disabled = false;
      $('footNote').innerHTML = `<span class="warn">기록하지 못했습니다: ${escapeHTML(e.message || String(e))}</span>`;
      return;
    }
    $('geo').hidden = true; $('jp').hidden = true;
    renderDone(rec);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
